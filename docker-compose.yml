services:
  web:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      FLASK_ENV: production
      # Only behind a reverse proxy: set TRUSTED_PROXY_COUNT in .env to its hop count.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Same named volume as before; photos now live outside the public static folder.
      - static_uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Daily database dump plus a photo archive, kept for BACKUP_KEEP_DAYS days.
  # Copy them to the host with: docker compose cp backup:/backups ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - db_backups:/backups
      - static_uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        while true; do
          stamp=$$(date +%Y%m%d_%H%M%S)
          if pg_dump --format=custom --no-owner --file=/backups/kaya_pts_$${stamp}.dump; then
            tar -czf /backups/kaya_pts_$${stamp}_uploads.tar.gz -C /uploads .
            find /backups -name 'kaya_pts_*' -mtime +$${BACKUP_KEEP_DAYS} -delete
            echo "Yedek tamamlandı: $${stamp}"
          else
            rm -f /backups/kaya_pts_$${stamp}.dump
            echo "HATA: Yedekleme başarısız: $${stamp}" >&2
          fi
          sleep $${BACKUP_INTERVAL_SECONDS}
        done
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  static_uploads:
  db_backups:
