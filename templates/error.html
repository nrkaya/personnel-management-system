{% extends 'base.html' %}

{% block content %}
<div class="glass error-container">
    <div class="error-code">{{ code }}</div>
    <h2 class="error-title">{{ title }}</h2>
    <p class="error-desc">{{ description }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i data-lucide="home"></i> {{ _('err_btn_home') }}
    </a>
</div>
{% endblock %}

{% block login_content %}
<div class="login-wrapper">
    <div class="glass login-box">
        <div class="error-code">{{ code }}</div>
        <h2 class="error-title">{{ title }}</h2>
        <p class="error-desc">{{ description }}</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">{{ _('login_heading') }}</a>
    </div>
</div>
{% endblock %}
