{% extends 'base.html' %}

{% block login_content %}
<div class="login-wrapper">
    <div class="glass login-box">
        <div class="login-brand">
            <div class="login-brand-logo">
                <i data-lucide="shield-check" class="brand-icon-lg"></i>
                <span>KAYA PTS</span>
            </div>
            <div class="login-brand-sub">Kaya Personel Takip Sistemi (Enterprise)</div>
        </div>

        <h3 class="login-heading">Güvenli Giriş</h3>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label><i data-lucide="user" class="icon-inline"></i> Kullanıcı Adı</label>
                <input type="text" name="kullanici_adi" class="form-control" required autofocus placeholder="Kullanıcı adınız..." value="{{ kullanici_adi or '' }}">
            </div>
            
            <div class="form-group">
                <label><i data-lucide="lock" class="icon-inline"></i> Şifre</label>
                <input type="password" name="sifre" class="form-control" required placeholder="Şifreniz...">
            </div>

            <div class="login-help-note">
                <i data-lucide="shield-alert" class="icon-inline"></i> 5 hatalı denemede hesap 10 dakika kilitlenir.
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <i data-lucide="log-in"></i> Sisteme Giriş Yap
            </button>
        </form>
    </div>
</div>
{% endblock %}
